# Dev → Git → UAT: exports the solution from Dev, versions it in solutions/ and imports the managed package into UAT.
name: "Dev to UAT"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      change_description:
        description: "Describe what changed in this deployment (used as the commit message)"
        required: true
        type: string

permissions:
  contents: write   # to commit the exported solution to main

concurrency:
  group: dev-para-uat
  cancel-in-progress: false

env:
  # Replace <NOME_DA_SOLUCAO> with the solution UNIQUE name (or create the PP_SOLUTION_NAME repository variable).
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME || '<NOME_DA_SOLUCAO>' }}

jobs:
  exportar-dev:
    name: "1. Export from Dev and commit"
    runs-on: ubuntu-latest
    environment: dev
    env:
      PAC_CLIENT_ID: ${{ vars.PAC_CLIENT_ID || secrets.PAC_CLIENT_ID }}
      PAC_CLIENT_SECRET: ${{ secrets.PAC_CLIENT_SECRET }}
      PAC_TENANT_ID: ${{ vars.PAC_TENANT_ID || secrets.PAC_TENANT_ID }}
      PP_ENVIRONMENT_URL: ${{ vars.PP_DEV_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Power Platform CLI (pac)
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Authenticate to Dev (service principal)
        run: |
          pac auth create --name dev \
            --applicationId "$PAC_CLIENT_ID" \
            --clientSecret "$PAC_CLIENT_SECRET" \
            --tenant "$PAC_TENANT_ID" \
            --environment "$PP_ENVIRONMENT_URL"

      - name: Export solution (unmanaged and managed)
        run: |
          mkdir -p out
          pac solution export --name "$SOLUTION_NAME" --path "out/${SOLUTION_NAME}.zip" --overwrite --async
          pac solution export --name "$SOLUTION_NAME" --path "out/${SOLUTION_NAME}_managed.zip" --managed --overwrite --async

      - name: Unpack into solutions/<solution-name>/
        run: |
          pac solution unpack \
            --zipfile "out/${SOLUTION_NAME}.zip" \
            --folder "solutions/${SOLUTION_NAME}" \
            --packagetype Both \
            --allowDelete --allowWrite --clobber

      - name: Sanity check (repack managed from Git)
        run: |
          mkdir -p out/checagem
          pac solution pack \
            --zipfile "out/checagem/${SOLUTION_NAME}_managed.zip" \
            --folder "solutions/${SOLUTION_NAME}" \
            --packagetype Managed

      - name: Commit to main
        # Commits made with GITHUB_TOKEN do not trigger new workflow runs, so there is no loop.
        env:
          CHANGE_DESCRIPTION: ${{ inputs.change_description }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "solutions/${SOLUTION_NAME}"
          if git diff --cached --quiet; then
            echo "No changes in the solution; nothing to commit."
          else
            if [ -z "$CHANGE_DESCRIPTION" ]; then
              CHANGE_DESCRIPTION="Export ${SOLUTION_NAME} from Dev"
            fi
            git commit -m "$CHANGE_DESCRIPTION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload managed package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pacote-managed
          path: out/${{ env.SOLUTION_NAME }}_managed.zip
          if-no-files-found: error

  importar-uat:
    name: "2. Import into UAT"
    needs: exportar-dev
    runs-on: ubuntu-latest
    environment: uat
    env:
      PAC_CLIENT_ID: ${{ vars.PAC_CLIENT_ID || secrets.PAC_CLIENT_ID }}
      PAC_CLIENT_SECRET: ${{ secrets.PAC_CLIENT_SECRET }}
      PAC_TENANT_ID: ${{ vars.PAC_TENANT_ID || secrets.PAC_TENANT_ID }}
      PP_ENVIRONMENT_URL: ${{ vars.PP_UAT_URL }}
    steps:
      - name: Download managed package
        uses: actions/download-artifact@v8
        with:
          name: pacote-managed
          path: pacote

      - name: Install Power Platform CLI (pac)
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Authenticate to UAT (service principal)
        run: |
          pac auth create --name uat \
            --applicationId "$PAC_CLIENT_ID" \
            --clientSecret "$PAC_CLIENT_SECRET" \
            --tenant "$PAC_TENANT_ID" \
            --environment "$PP_ENVIRONMENT_URL"

      - name: Import managed solution into UAT
        run: |
          pac solution import \
            --path "pacote/${SOLUTION_NAME}_managed.zip" \
            --async --activate-plugins \
            --max-async-wait-time 60

      - name: Summary
        run: echo "✅ ${SOLUTION_NAME} imported into UAT ($PP_ENVIRONMENT_URL)." >> "$GITHUB_STEP_SUMMARY"
