# Manual Production deploy: imports into Prod the SAME managed package that passed in UAT.
name: "Deploy Prod"

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Type PRODUCAO to confirm the deployment"
        required: true
        type: string

permissions:
  contents: read
  actions: read   # to find and download the artifact from the latest "Dev to UAT" run

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME || '<NOME_DA_SOLUCAO>' }}

jobs:
  importar-prod:
    name: "Import into Prod"
    if: inputs.confirmacao == 'PRODUCAO'
    runs-on: ubuntu-latest
    environment: production
    env:
      PAC_CLIENT_ID: ${{ vars.PAC_CLIENT_ID || secrets.PAC_CLIENT_ID }}
      PAC_CLIENT_SECRET: ${{ secrets.PAC_CLIENT_SECRET }}
      PAC_TENANT_ID: ${{ vars.PAC_TENANT_ID || secrets.PAC_TENANT_ID }}
      PP_ENVIRONMENT_URL: ${{ vars.PP_PROD_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find latest successful "Dev to UAT" run
        id: uat
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dev-para-uat.yml \
            --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "UAT run used: ${RUN_ID:-none (will repack from solutions/)}"

      - name: Download managed package tested in UAT
        if: steps.uat.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: pacote-managed
          path: pacote
          run-id: ${{ steps.uat.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install Power Platform CLI (pac)
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Fallback - repack managed from solutions/
        if: steps.uat.outputs.run_id == ''
        run: |
          mkdir -p pacote
          pac solution pack \
            --zipfile "pacote/${SOLUTION_NAME}_managed.zip" \
            --folder "solutions/${SOLUTION_NAME}" \
            --packagetype Managed

      - name: Authenticate to Prod (service principal)
        run: |
          pac auth create --name prod \
            --applicationId "$PAC_CLIENT_ID" \
            --clientSecret "$PAC_CLIENT_SECRET" \
            --tenant "$PAC_TENANT_ID" \
            --environment "$PP_ENVIRONMENT_URL"

      - name: Import managed solution into Prod
        run: |
          pac solution import \
            --path "pacote/${SOLUTION_NAME}_managed.zip" \
            --async --activate-plugins \
            --max-async-wait-time 60

      - name: Job summary status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ${SOLUTION_NAME} successfully imported into Prod ($PP_ENVIRONMENT_URL). UAT run package: ${{ steps.uat.outputs.run_id || 'repacked from solutions/' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Deployment of ${SOLUTION_NAME} to Prod failed. See the step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
