# Deploy manual para Produção: importa no Prod o MESMO pacote managed que passou no UAT.
name: "Deploy Prod"

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PRODUCAO para confirmar o deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read   # para localizar e baixar o artefato da última execução do "Dev para UAT"

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME || '<NOME_DA_SOLUCAO>' }}

jobs:
  importar-prod:
    name: "Importar no Prod"
    if: inputs.confirmacao == 'PRODUCAO'
    runs-on: ubuntu-latest
    environment: production
    env:
      PAC_CLIENT_ID: ${{ secrets.PAC_CLIENT_ID }}
      PAC_CLIENT_SECRET: ${{ secrets.PAC_CLIENT_SECRET }}
      PAC_TENANT_ID: ${{ secrets.PAC_TENANT_ID }}
      PP_ENVIRONMENT_URL: ${{ vars.PP_ENVIRONMENT_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Localizar a última execução bem-sucedida do "Dev para UAT"
        id: uat
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dev-para-uat.yml \
            --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Execução do UAT usada: ${RUN_ID:-nenhuma (vai reempacotar a partir de solutions/)}"

      - name: Baixar o pacote managed testado no UAT
        if: steps.uat.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: pacote-managed
          path: pacote
          run-id: ${{ steps.uat.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Instalar o Power Platform CLI (pac)
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Plano B - reempacotar o managed a partir de solutions/
        if: steps.uat.outputs.run_id == ''
        run: |
          mkdir -p pacote
          pac solution pack \
            --zipfile "pacote/${SOLUTION_NAME}_managed.zip" \
            --folder "solutions/${SOLUTION_NAME}" \
            --packagetype Managed

      - name: Autenticar no Prod (service principal)
        run: |
          pac auth create --name prod \
            --applicationId "$PAC_CLIENT_ID" \
            --clientSecret "$PAC_CLIENT_SECRET" \
            --tenant "$PAC_TENANT_ID" \
            --environment "$PP_ENVIRONMENT_URL"

      - name: Importar o managed no Prod
        run: |
          pac solution import \
            --path "pacote/${SOLUTION_NAME}_managed.zip" \
            --async --activate-plugins \
            --max-async-wait-time 60

      - name: Status no resumo do job
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ${SOLUTION_NAME} importada com sucesso no Prod ($PP_ENVIRONMENT_URL). Pacote da execução UAT: ${{ steps.uat.outputs.run_id || 'reempacotado de solutions/' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Falha no deploy de ${SOLUTION_NAME} no Prod. Veja os logs dos passos acima." >> "$GITHUB_STEP_SUMMARY"
          fi
