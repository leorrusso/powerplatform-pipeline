# Prod: on push to main (including a merged pull request), pack the managed solution
# from solutions/<name> in this commit and import it into Prod.
# The unpacked folder is the source a pull request merges. A managed zip uploaded by
# another workflow is not this commit, and that artifact expires.
name: "Deploy Prod"

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Replace <NOME_DA_SOLUCAO> with the solution UNIQUE name (or create the PP_SOLUTION_NAME repository variable).
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME || '<NOME_DA_SOLUCAO>' }}

jobs:
  importar-prod:
    name: "Import into Prod"
    runs-on: ubuntu-latest
    environment: Prod
    env:
      PAC_CLIENT_ID: ${{ vars.PAC_CLIENT_ID || secrets.PAC_CLIENT_ID }}
      PAC_CLIENT_SECRET: ${{ secrets.PAC_CLIENT_SECRET }}
      PAC_TENANT_ID: ${{ vars.PAC_TENANT_ID || secrets.PAC_TENANT_ID }}
      PP_ENVIRONMENT_URL: ${{ vars.PP_PROD_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Power Platform CLI (pac)
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Pack managed solution from solutions/
        run: |
          mkdir -p out
          pac solution pack \
            --zipfile "out/${SOLUTION_NAME}_managed.zip" \
            --folder "solutions/${SOLUTION_NAME}" \
            --packagetype Managed

      - name: Authenticate to Prod (service principal)
        run: |
          pac auth create --name prod \
            --applicationId "$PAC_CLIENT_ID" \
            --clientSecret "$PAC_CLIENT_SECRET" \
            --tenant "$PAC_TENANT_ID" \
            --environment "$PP_ENVIRONMENT_URL"

      - name: Import managed solution into Prod
        run: |
          pac solution import \
            --path "out/${SOLUTION_NAME}_managed.zip" \
            --async --activate-plugins \
            --max-async-wait-time 60

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ${SOLUTION_NAME} imported into Prod ($PP_ENVIRONMENT_URL)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Deployment of ${SOLUTION_NAME} to Prod failed. See the step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
